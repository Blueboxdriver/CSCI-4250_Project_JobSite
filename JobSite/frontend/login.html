
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | ETSU Student Jobs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #00053E;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .site-title {
            color: #FFC72C;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: white;
            margin-bottom: 25px;
        }

        .login-box {
            background-color: white;
            color: #00053E;
            padding: 30px;
            border-radius: 8px;
        }

        .login-box h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .login-box form p {
            text-align: left;
            margin-bottom: 18px;
        }

        .login-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #CCCCCC;
            border-radius: 5px;
            font-size: 15px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #00053E;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #FFC72C;
            color: #00053E;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #E6B323;
        }

        .signup-text {
            margin-top: 20px;
            font-size: 14px;
            color: #444444;
        }

        .signup-text a {
            color: #00053E;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            color: #FFC72C;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .logout-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: transparent;
            color: #00053E;
            border: 1px solid #00053E;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: #F0F0F0;
        }

        .errorlist {
            color: #B00020;
            font-size: 13px;
            text-align: left;
            padding-left: 20px;
        }

        @media (max-width: 600px) {
            .login-box {
                padding: 25px 20px;
            }

            .site-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2 class="site-title">ETSU Student Jobs</h2>
        <p class="subtitle">Student Login</p>

        <div class="login-box">

            <h1>Log in</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="login-btn">
                    Log in
                </button>
            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="{% url 'accounts:signup' %}">
                    Sign up
                </a>
            </p>

            {% if user.is_authenticated %}
                <form action="{% url 'accounts:logout' %}"
                      method="post">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">
                        Log out
                    </button>
                </form>
            {% endif %}

        </div>

        <a href="/" class="back-home">
            &larr; Back to Home
        </a>

    </div>

</body>
</html>
