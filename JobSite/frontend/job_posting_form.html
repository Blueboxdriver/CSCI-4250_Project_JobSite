
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Job Posting | ETSU Student Jobs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #00053E;
            min-height: 100vh;
            padding: 40px 20px;
        }

        main {
            max-width: 650px;
            margin: 0 auto;
        }

        .site-title {
            text-align: center;
            color: #FFC72C;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .form-container {
            background-color: white;
            padding: 35px;
            border-radius: 8px;
        }

        .form-container h1 {
            color: #00053E;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .description {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #DDDDDD;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            color: #00053E;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #CCCCCC;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            background-color: white;
        }

        form textarea {
            min-height: 120px;
            resize: vertical;
        }

        form input[type="checkbox"],
        form input[type="radio"] {
            width: auto;
            margin-right: 8px;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            outline: none;
            border-color: #00053E;
        }

        .publish-btn {
            width: 100%;
            padding: 13px;
            background-color: #FFC72C;
            color: #00053E;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .publish-btn:hover {
            background-color: #E6B323;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #00053E;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #B00020;
            font-size: 13px;
            padding-left: 20px;
        }

        .helptext {
            display: block;
            color: #666666;
            font-size: 12px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .form-container {
                padding: 25px 20px;
            }

            .site-title {
                font-size: 24px;
            }

            .form-container h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main>
        <h2 class="site-title">ETSU Student Jobs</h2>
        <p class="subtitle">Create a Job Posting</p>

        <div class="form-container">

            <h1>Create a job posting</h1>

            <p class="description">
                Fill out the information below to
                publish a new job opportunity for students.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="publish-btn">
                    Publish Posting
                </button>
            </form>

            <p class="back-link">
                <a href="{% url 'jobs:list' %}">
                    &larr; Back to Job Postings
                </a>
            </p>

        </div>
    </main>

</body>
</html>
