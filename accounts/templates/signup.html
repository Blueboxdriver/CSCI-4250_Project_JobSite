<!Doctype html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<h2>Create Account</h2>
	<form id='typeSelector'><br />
		<p>I am a...</p>
		<input onclick='isStudent()' type="radio" id='student' name='accountType'>
		<label id='student' name='accountType'>Student</label>
		<input onclick='isFaculty()' type='radio' id='faculty' name='accountType'>
		<label id='faculty' name='accountType'>Faculty Member</label>
	</form>
	<br />
	<form id='createAccountStudent' action="{% url 'accounts:registerStudent' %}" method="POST" hidden>
		{% csrf_token %}
		<label for='firstName'>First Name</label><br />
		<input type='text' id='firstName' name='firstName' required maxlength='100'><br />
		<label for='lastName'>Last Name</label><br /> 
		<input type='text' id='lastName' name='lastName' required maxlength='100'><br />
		<label for='studentId'>Student ID</label><br />
		<input type='text' id='studentId' name='studentId' required maxlength='20' pattern='E[0-9]+'><br />
		<label for='email'>Email Address</label><br /> 
		<input type='email' id='email' name='email' required maxlength='100' pattern='[A-Za-Z0-9]+@[A-Za-Z0-9]\.[a-z]{2,}'><br />
		<label for='password'>Password</label><br />
		<input type='password' id='password' name='password'><br />
		<label for='field'>Field of Study</label><br />
		<input type='field' id='field' name='field' required><br />
		<label for='year'>Year</label><br />
		<input type='text' id='year' name='year' required><br />
		<input type='submit' value='Submit'>
	</form>
	<form id='createAccountFaculty' action="{% url 'accounts:registerFaculty' %}" method="POST" hidden>
		{% csrf_token %}
		<label for='firstName'>First Name</label><br />
		<input type='text' id='firstName' name='firstName' required maxlength='100'><br />
		<label for='lastName'>Last Name</label><br /> 
		<input type='text' id='lastName' name='lastName' required maxlength='100'><br />
		<label for='facultyId'>Faculty ID</label><br /> 
		<input type='text' id='facultyId' name='facultyId' required maxlength='30'><br />
		<label for='email'>Email Address</label><br /> 
		<input type='email' id='email' name='email' required maxlength='100' pattern='[A-Za-Z0-9]+@[A-Za-Z0-9]\.[a-z]{2,}'><br />
		<label for='password'>Password</label><br />
		<input type='password' id='password' name='password' required maxlength='100'><br />
		<label for='department'>Department</label><br /> 
		<input type='text' id='department' name='department' required maxlength='100'><br />
		<label for='lastName'>Position</label><br /> 
		<input type='text' id='position' name='position' required maxlength='100'><br />
		<input type='submit' value='Submit'>
	</form>
	
	<script>
	function isStudent()
	{
		document.getElementById("createAccountFaculty").hidden = true;
		document.getElementById("createAccountStudent").hidden = false;
	}
	function isFaculty()
	{
		document.getElementById("createAccountStudent").hidden = true;
		document.getElementById("createAccountFaculty").hidden = false;
	}
	</script>
</body>
